# XcodeGen spec. On your Mac:  brew install xcodegen && xcodegen && open Tafsiri.xcodeproj
name: Tafsiri
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: 0.9.0
schemes:
  Tafsiri:
    build:
      targets:
        Tafsiri: all
targets:
  Tafsiri:
    type: application
    platform: iOS
    sources:
      - Tafsiri
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    info:
      path: Tafsiri/Info.plist
      properties:
        CFBundleDisplayName: Tafsiri
        NSMicrophoneUsageDescription: "Tafsiri listens for Kiswahili around you and translates it into English, on your phone."
        UIBackgroundModes: [audio]          # keeps listening with the screen locked
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tafsiri   # change "example" to your name
        PRODUCT_NAME: Tafsiri
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
